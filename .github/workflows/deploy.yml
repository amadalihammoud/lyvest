name: Deploy to Vercel

# GATE DE PRODUÇÃO
# Antes, este workflow disparava em `push: branches: [main]` sem `needs` e sem
# nenhuma dependência do CI: qualquer merge — inclusive os feitos pelos scripts
# .bat com `--no-verify`, sem PR — ia direto para produção sem passar por lint,
# typecheck, teste ou build. Agora produção só sai depois do CI Pipeline fechar
# verde NO MESMO COMMIT.
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: 🚀 Deploy Production
    runs-on: ubuntu-latest
    # workflow_dispatch continua sendo a válvula de escape manual (deploy de
    # emergência). O caminho automático exige conclusão 'success' do CI.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Em workflow_run o checkout padrão aponta para o head do branch, não
          # para o commit que o CI validou. Sem fixar o SHA, um push que chegasse
          # durante o CI faria o deploy publicar código que ninguém testou.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
